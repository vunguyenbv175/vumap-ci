[versions]
# Verified 2026-10-14/15 against Google Maven + Maven Central metadata (latest stable).
# Compose BOM is the newest BOM whose artifacts require compileSdk <= 36
# (compose 1.12.x needs 37, which has no public platform yet; verified via AAR metadata).
# MapLibre android-sdk 13.6.1 is the newest stable (Maven Central); it renamed
# MapboxMap -> MapLibreMap.
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
maplibre = "13.6.1"
playLocation = "21.4.0"
activityCompose = "1.9.3"
lifecycleRuntimeCompose = "2.10.0"
datastore = "1.2.1"
coreKtx = "1.18.0"
junit = "4.13.2"
okhttp = "4.12.0"
jsonOrg = "20240303"
coroutines = "1.10.1"
openlocationcode = "1.0.4"
sqliteJdbc = "3.46.0.0"

[libraries]
# MapLibre Native Android SDK (map rendering; no telemetry collected by SDK, no analytics deps added)
maplibre-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
# GPS
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playLocation" }
# AndroidX / Compose
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Local settings persistence (on-device only, no cloud sync)
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# Networking (P0 routing chain, per-host cooldown, MockWebServer tests)
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Plus Codes decoder (explicit lib per project plan section 5; on-device, no network use)
openlocationcode = { group = "com.google.openlocationcode", name = "openlocationcode", version.ref = "openlocationcode" }
# Unit tests (JVM only)
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
json-org = { group = "org.json", name = "json", version.ref = "jsonOrg" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NOTE: `org.jetbrains.kotlin.android` is intentionally absent — AGP 9 compiles Kotlin
# built-in. The Compose compiler plugin is still applied explicitly; the KGP version AGP
# runs on is raised via the buildscript classpath in the root build file.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
